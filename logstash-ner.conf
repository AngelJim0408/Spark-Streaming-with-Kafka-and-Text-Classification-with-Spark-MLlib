# Logstash pipeline: Kafka topic2 (entity counts from ner_stream.py) -> Elasticsearch
#
# Settings come from environment variables, with defaults after the colon:
#   KAFKA_BOOTSTRAP (localhost:9092)   KAFKA_TOPIC (topic2)
#   ES_HOST (http://localhost:9200)    ES_INDEX (ner-counts)
#
# Run:  bin/logstash -f /path/to/logstash-ner.conf

input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP:localhost:9092}"
    topics            => ["${KAFKA_TOPIC:topic2}"]
    group_id          => "logstash-ner"
    auto_offset_reset => "earliest"
    codec             => json      # each message is {"entity", "count", "updated_at"}
  }
}

filter {
  # Drop fields Logstash adds that we don't need in the index.
  mutate { remove_field => ["@version", "event"] }
}

output {
  elasticsearch {
    hosts       => ["${ES_HOST:http://localhost:9200}"]
    index       => "${ES_INDEX:ner-counts}"
    # One document per entity: every new count overwrites the previous one,
    # so the index always holds the latest running count for each entity.
    document_id => "%{entity}"

    # If Elasticsearch security is ON (the default in 8.x/9.x), uncomment and
    # set these, and use an https:// ES_HOST. See README.md.
    # user     => "${ES_USER}"
    # password => "${ES_PASSWORD}"
    # ssl_certificate_authorities => ["${ES_CA_CERT}"]
  }

  # Uncomment to see each event Logstash receives:
  # stdout { codec => rubydebug }
}
